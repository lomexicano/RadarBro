buildscript {
    repositories {
        mavenLocal()
        google()
    }
    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.0.0'
    }
}

plugins {
    // Apply the java-library plugin to add support for Java Library
    id 'java-library'
    id 'java'
}


repositories {
    // Use jcenter for resolving dependencies.
    // You can declare any Maven/Ivy/file repository here.
    mavenCentral()
    flatDir {
    	dirs 'libs'
    }
  
}

apply plugin: 'java' 		// 
sourceCompatibility = 1.8	// It ensures java 8 as compiler
targetCompatibility = 1.8	//

dependencies {
    // This dependency is exported to consumers, that is to say found on their compile classpath.
    api 'org.apache.commons:commons-math3:3.6.1'

    // This dependency is used internally, and not exposed to consumers on their own compile classpath.
    implementation 'com.google.guava:guava:28.2-jre'

    // Use JUnit test framework
    testImplementation 'junit:junit:4.12'

    //implementation 'org.json:json:20210307'
    implementation fileTree(include: ['*.jar'], dir: 'libs')

}


task Bezouro(type:Exec) {
    dependsOn build
    group = 'obfuscate'

    doLast {
      task copyJar(type: Copy) {
          def obfuscatedJar = 'build/libs/' + 'mod_' + projectName + '_for_1.5.2' + '.litemod'
          def modulesFolder = 'C:/Edu/mc/Modpack152/data/.minecraft/mods'
          copy {
              from obfuscatedJar
              into modulesFolder
          }
          println('Módulo copiado da pasta build/libs para a pasta de modulos do jogo!')
    }
        println 'OK. Obfuscated with AMS-Obfkit technology. By Bezouro'
    }

    workingDir 'build/libs/'
    commandLine 'java', '-jar', '../../AMS-Obfkit/Runtime/Obfkit-1.0.jar', '--mapFile', '../../AMS-Obfkit/Runtime/Mappings/Minecraft 1.5.2/mcp-notch.srg', '--ref', '../../AMS-Obfkit/Runtime/Ref/Obf/minecraft-1.5.2.jar', '--input', projectName + '.jar' , '--output',  'mod_' + projectName + '_for_1.5.2' + '.litemod'
}

jar {
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    include 'me/lomexicano/**'
    from('src/main/resources') {
        include 'litemod.json'
        include 'version.txt'
        include 'readme.txt'
        include 'radaricons.png'
    }
    //include 'com/google/gson/**'
    //include 'org/json/**'
    //archiveBaseName.set 'module_MexicanStuff'
}

task proguard(type: ProGuardTask) {
    dependsOn Bezouro
    group = 'obfuscate'
    configuration 'proguard.txt'

    doFirst {
        println 'Obfuscating with proguard'
    }

    injars 'build/libs/' + projectName + '-' + apiVersion + '.jar'
    outjars 'build/libs/' + projectName + '-' + apiVersion + '-Pg.jar'
}





task customBuild(type: GradleBuild) {
    group = 'build'
    tasks = ['clean', 'assemble']
}


